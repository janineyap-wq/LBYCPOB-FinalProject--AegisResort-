<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Resort Management Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --hotel-gold: #c5a880;
            --hotel-gold-hover: #b09168;
            --hotel-dark: #121a24;
            --hotel-bg: #f8f6f0;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--hotel-bg);
            color: #2b2b2b;
        }
        h1, h2, h3, h4, h5, .brand-font {
            font-family: 'Playfair Display', serif;
        }
        .navbar-custom {
            background-color: var(--hotel-dark);
            border-bottom: 2px solid var(--hotel-gold);
        }
        .luxury-card {
            border: none;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .luxury-card-header {
            background: transparent;
            border-bottom: 1px solid #f0ece1;
            padding: 1.25rem 1.5rem;
        }
        .btn-gold {
            background-color: var(--hotel-gold);
            color: #fff;
            font-weight: 600;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-gold:hover {
            background-color: var(--hotel-gold-hover);
            color: #fff;
        }
        .badge-gold {
            background-color: #f4ece1;
            color: #8c6d3f;
            font-weight: 600;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--hotel-gold);
            box-shadow: 0 0 0 0.25rem rgba(197, 168, 128, 0.25);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom mb-5 shadow-sm py-3">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="navbar-brand mb-0 h1 brand-font fs-4 text-white"> Aegis Resort Portal</span>
        <div th:if="${currentUser}" class="text-white small d-flex align-items-center">
            <span class="me-3">
                Logged in as: <strong th:text="${currentUser.fullName}">User Name</strong>
                <span class="badge badge-gold ms-1" th:text="${currentUser.role}">ROLE</span>
            </span>
            <a href="/logout" class="btn btn-sm btn-outline-light rounded-pill px-3">Logout</a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div th:if="${errorMessage}" class="alert alert-warning border-0 shadow-sm alert-dismissible fade show mb-4" role="alert">
        <strong>Input Error:</strong> <span th:text="${errorMessage}">Error message here</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card luxury-card h-100">
                <div class="luxury-card-header d-flex justify-content-between align-items-center">
                    <h5 class="card-title brand-font mb-0 text-dark"> Security Access Scanner</h5>
                    <span class="badge bg-light text-dark border">Access Control</span>
                </div>
                <div class="card-body p-4">
                    <form action="/web/scan" method="post">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">SELECT GUEST</label>
                            <select name="guestId" class="form-select py-2" required>
                                <option value="G-01">G-01 — Alice (Day Tour)</option>
                                <option value="G-02">G-02 — Bob (Overnight)</option>
                                <option value="G-03">G-03 — Charlie (VIP)</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">SELECT TARGET FACILITY</label>
                            <select name="facilityId" class="form-select py-2" required>
                                <option value="GYM-01">Fitness Center (Gym) — Overnight &amp; VIP</option>
                                <option value="EVENT-01">Grand Hall Event Room — VIP Only</option>
                                <option value="REST-01">Resort Restaurant — All Tiers</option>
                                <option value="PARK-01">Resort Parking Lot — All Tiers</option>
                                <option value="ROOM-101">Guest Room 101 — Overnight &amp; VIP</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">Simulate Keycard Scan</button>
                    </form>

                    <div th:if="${scanResult}"
                         class="mt-4 alert border-0 shadow-sm"
                         th:classappend="${scanAllowed} ? 'alert-success' : 'alert-danger'">
                        <h6 class="alert-heading fw-bold mb-1" th:text="${scanAllowed} ? 'ACCESS GRANTED' : 'ACCESS DENIED'"></h6>
                        <hr class="my-2">
                        <p class="mb-0 font-monospace small" th:text="${scanResult}"></p>
                    </div>
                </div>
            </div>
        </div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
